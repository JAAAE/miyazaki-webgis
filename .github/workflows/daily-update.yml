name: Daily Miyazaki WebGIS Auto-Iteration

on:
  schedule:
    # 每天台灣時間早上 08:17（UTC 00:17，非整點避開 GitHub 尖峰排隊延遲）自動在雲端執行，免開電腦
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miyazaki-daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fetch new Miyazaki YouTube videos (travel, shopping, souvenirs, food)
        run: node scripts/fetch_yt.js

      - name: Fetch new Miyazaki web guides & souvenir/shopping articles
        run: node scripts/fetch_web_guides.js

      - name: Rebuild single-file WebGIS (index.html)
        run: node scripts/build_webgis.js

      - name: Validate generated WebGIS HTML
        run: node scripts/validate_webgis.js

      - name: Install CJK fonts for PDF export
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Regenerate YouTube & Web Blog PDF guide
        run: node scripts/export_pdf.js

      - name: Commit and push updates to GitHub Pages (main)
        id: commit_step
        run: |
          YT_COUNT=$(node -e "console.log(require('./data/yt_videos_clean.json').length)")
          WEB_COUNT=$(node -e "console.log(require('./data/web_guides.json').length)")
          echo "yt_count=${YT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "web_count=${WEB_COUNT}" >> "$GITHUB_OUTPUT"
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new changes today."
            exit 0
          fi
          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yt_videos_clean.json data/web_guides.json index.html miyazaki_youtube_blog_guide.pdf
          git commit -m "chore(daily): ${TODAY} cloud update (YT ${YT_COUNT}, Web ${WEB_COUNT}, PDF)"
          git pull --rebase origin main
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync GitHub Repository About (Description & Homepage)
        if: steps.commit_step.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.REPO_META_TOKEN || secrets.A }}
          YT_COUNT: ${{ steps.commit_step.outputs.yt_count }}
          WEB_COUNT: ${{ steps.commit_step.outputs.web_count }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Notice: REPO_META_TOKEN (or A) secret is not set; skipping automatic About update."
            exit 0
          fi
          DESC="Miyazaki 4D3N Real-Road WebGIS (9 Basemaps, 18 Parking Lots, ${YT_COUNT} YouTube Videos, ${WEB_COUNT} Web Guides)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}" \
            -f "description=${DESC}" \
            -f "homepage=https://jaaae.github.io/miyazaki-webgis/" > /dev/null
          echo "Updated repository About: ${DESC}"
